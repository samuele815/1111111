对家族内部是否可信的问题。","chance":0.72,"successText":"可信长辈将账册封存，并安排另一人核对。你没有独占证据，却让家族多了一份可以继续查验的材料。","failureText":"账册被暂时压下，家族只答应留存，尚未决定是否采取行动。","successFx":{"stats":{"family":2,"reputation":1},"flags":{"ledgerShared":true,"mineEvidence":"medium"}},"failureFx":{"stats":{"mind":1},"flags":{"ledgerShared":true,"ledgerDelayed":true}},"cost":0},{"id":"give-county","title":"拿账册去县衙备案","desc":"已有官府关系时有利于正式核验，没证据来源会被质疑。","chance":0.62,"successText":"书吏登记了复本并要求继续补充证人，矿权争议终于进入可追踪的程序。","failureText":"书吏质疑来源，只愿先做留档。你仍有记录，但不能指望县衙立刻站队。","successFx":{"stats":{"reputation":2},"flags":{"countyRelation":"evidence","mineEvidence":"strong"},"items":["县衙矿账备案"]},"failureFx":{"stats":{"comprehension":1},"flags":{"countyRelation":"knows","mineEvidence":"weak"}},"cost":0},{"id":"give-shen","title":"把账册交给沈家，换钱或庇护","desc":"短期改善处境，但沈家会把证据作为自身筹码。","chance":0.76,"successText":"沈家愿意提供一笔资源或落脚帮助，并留下可追溯副本作为谈判筹码。","failureText":"沈家认为证据不足，只给少量帮助，没有答应替林家出头。","successFx":{"money":14,"flags":{"shenRelation":"cooperation","mineEvidence":"shared"},"stats":{"family":1}},"failureFx":{"money":3,"flags":{"shenRelation":"cautious"},"stats":{"mind":1}},"cost":0},{"id":"destroy-ledger","title":"销毁账册，避免继续惹祸","desc":"风险降低，但失去一条重要证据。","chance":1,"successText":"你烧掉账册，暂时不再追查矿产纠纷，决定把精力留给自己的修炼与生计。","failureText":{},"successFx":{"flags":{"ledgerDestroyed":true,"mineEvidence":"none"},"stats":{"mind":2}},"failureFx":{},"cost":0}]},{"id":"training-route","arc":"body","minRealm":1,"minLevel":5,"cooldownDays":0,"cooldownYears":1,"title":"练体五重：修炼方法的分岔","prompt":"你发现单纯增加训练量，未必能让身体真正变强。气血、发力、恢复、药材与实战经验需要互相配合。练体五重这一步，你想走哪条路？","options":[{"id":"old-teacher","title":"找旧武师逐式打牢基础","desc":"进境较慢，但更不容易留下发力错误。","chance":0.79,"successText":"武师逐式纠正你的站桩、呼吸和发力，基础逐渐稳定。","failureText":{},"successFx":{"cultivation":8,"stats":{"comprehension":2,"mind":2},"flags":{"foundation":true},"skills":["基础发力校正"]},"failureFx":{"stats":{"stamina":-2},"flags":{"foundationPartial":true}},"cost":0},{"id":"herb-learning","title":"在药铺学识药，配合训练恢复","desc":"修炼和谋生兼顾，时间会被分散。","c minRealm":2,"minLevel":1,"kind":"game-adaptation"},{"id":"kingdom-arc","chapter":"武王—武圣阶段","title":"二十皇朝、八十王朝与母星格局","summary":"武王与武皇阶段进入皇朝层面的资源和立场冲突；武圣是皇朝可调动的高层战力，但仍低于七大圣地的圣人老祖层级。","nodeIds":["martial-king","martial-emperor","martial-saint"],"minRealm":7,"minLevel":1,"kind":"lore-adaptation"},{"id":"holylands-arc","chapter":"圣人阶段","title":"七大圣地与圣人老祖","summary":"圣人境的冲突进入母星顶层格局。七大圣地老祖属于圣地级最高战力；圣人与武圣必须分开，不能合并成同一个境界。","nodeIds":["seven-holy-lands"],"minRealm":10,"minLevel":1,"kind":"lore-adaptation"},{"id":"great-saint-arrival","chapter":"第三百章前后","title":"现实突破大圣，仍留在母星","summary":"现实中的林砚突破大圣境，仍处于母星篇后段。大圣不是离开母星的通行证，下一段真正门槛仍是现实突破圣王。","nodeIds":["great-saint-awakening"],"minRealm":11,"minLevel":1,"kind":"novel-continuity"},{"id":"covenant-arc","chapter":"第三百零一—三百二十章","title":"第十五卷《大圣立约》","summary":"赤麓关两朝冲突与落日岭五路武痕交织。林砚以大圣之力介入局势，重视盟约、路线和因果，现实推进至大圣二重。","nodeIds":["great-saint-covenant"],"minRealm":11,"minLevel":1,"kind":"novel-continuity"},{"id":"shenge-arc","chapter":"第三百二十一—三百四十章","title":"第十六卷《沉戈古原》","summary":"调查并关闭失控的古代防御阵，结合模拟推演和现实行动，逐步处理阵钉、中层调度与残阵主将。第三百三十五章突破大圣三重。","nodeIds":["shenge-ancient"],"minRealm":11,"minLevel":2,"kind":"novel-continuity"},{"id":"nine-yaw-arc","chapter":"第三百四十一—三百六十章","title":"第十七卷《九曜古域》","summary":"围绕九曜古域展开探勘，比较路线、资源采集和生态代价；模拟推演用于减少试错，现实行动仍需承担后果。卷末突破大圣四重。","nodeIds":["nine-yaw-domain"],"minRealm":11,"minLevel":3,"kind":"novel-continuity"},{"id":"north-burning-arc","chapter":"第三百六十一—三百八十章","title":"第十八卷《北境燃城》","summary":"凛川、望烽与石门卷入北境兵权冲突。林砚阻止焚城、打通撤离路线并处理军令失控，第三百七十八章突破大圣五重。","nodeIds":["north-burning-city"],"minRealm":11,"minLevel":4,"kind":"novel-continuity"},{"id":"no-day-arc","chapter":"第三百八十一—第四百章","title":"第十九卷《无昼荒原》","summary":"进入无昼荒原，处理地层压力、天然风道、塌陷和鸣骨兽群。林砚用模拟比较路线，再在现实中检验救援与探索的代价，突破大圣六重。","nodeIds":["no-day-wastes"],"minRealm":11,"minLevel":5,"kind":"novel-continuity"},{"id":"river-arc","chapter":"第四百零一—四百二十章","title":"第二十卷《回澜天河》","summary":"围绕回澜天河的河床隆起与异常回流展开。林砚与同伴协调三处分流、验证旧河槽方案，稳固大圣六重。","nodeIds":["river-backflow"],"minRealm":11,"minLevel":6,"kind":"novel-continuity"},{"id":"ask-balance-arc","chapter":"第四百二十一—四百四十章","title":"第二十一卷《问衡照野》","summary":"林砚参加问衡会，在切磋和十方衡台的结构检查中磨合道域的感知、承接与干预。第四百三十九章突破大圣七重；第四百四十章开启第七十次模拟。","nodeIds":["ask-balance"],"minRealm":11,"minLevel":6,"kind":"novel-continuity"},{"id":"star-sea-arc","chapter":"后续篇章 · 待接续","title":"星海篇：现实突破圣王后开启","summary":"这是明确的剧情门槛而不是已写完的剧情。只有现实达到圣王境后，主线才可离开母星进入星海；本版本只负责开启入口，不冒充尚未提供的后续小说正文。","nodeIds":["starsea-entry"],"minRealm":12,"minLevel":1,"kind":"future-gate"},{"id":"zhundi-emperor-arc","chapter":"后续篇章 · 待接续","title":"准帝与大帝：下界终局","summary":"大帝仍是下界篇终点之一，之后才可能继续仙道。这里保留境界推进和帝路选择接口；未提供的具体小说事件不擅自写成既有剧情。","nodeIds":["zhundi-path","great-emperor-path"],"minRealm":13,"minLevel":1,"kind":"future-gate"},{"id":"immortal-arc","chapter":"最终篇章 · 待接续","title":"成仙：万世命途的最终目标","summary":"成仙才是最终目标。当前版本加入终点验证与纪事封存，不把“突破大帝”误写成全书完结。","nodeIds":["immortal-awakening"],"minRealm":15,"minLevel":1,"kind":"future-gate"}]}</script>
<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('game-data').textContent);
  const $ = id => document.getElementById(id);
  const app = $('app');
  const STORE_KEY = 'xuanhuanLifeSimFreshV2';
  const MAX_STAT = 100000;
  const QUALITY = ['白','绿','蓝','紫','橙','红','七彩'];
  const QUALITY_COLOR = {'白':'#d9e1e6','绿':'#a9d99b','蓝':'#8bbaf4','紫':'#c2a1ff','橙':'#ffc17a','红':'#ff9292','七彩':'#95e9df'};
  const STAT_LABEL = Object.fromEntries(DATA.attrs.map(x => [x.key,x.label]));
  const TALENT_BY_NAME = new Map(DATA.talents.map(t => [t.name,t]));
  const REALM_POWER = [35,180,380,800,1700,3600,7600,16000,34000,72000,150000,320000,680000,1450000,3600000,8000000];
  const NAV = [
    ['home','主世界','⌂'],['story','万世主线','卷'],['simulate','人生模拟','命'],['tasks','任务与成就','✦'],['talents','天赋图鉴','✧'],
    ['archive','往世档案','卷'],['lore','世界志','山'],['legacy','传承与系统','印'],['settings','设置与存档','⚙']
  ];
  const tutorialPages = [
    {title:'系统绑定成功',text:'【万界人生模拟系统】已与宿主绑定。系统不替你做决定，也不会凭空赠予完整人生；它只会依据当前世界、人物关系、势力和实力，推演一种可能的未来。'},
    {title:'模拟并非另一个世界',text:'模拟发生在同一个大炎王朝与同一套人物关系中。模拟里的时间不会让现实自动流逝，但你在一世中留下的真实经历可以结算为积分与可兑换的传承。'},
    {title:'先选天赋，再定志向',text:'每世抽出三张不同天赋，选择其中一张。天赋只直接作用于本世；只有在结算时花费积分兑换，才能成为跨世传承。品级越高越稀有，但不代表所有困局都能靠天赋解决。'},
    {title:'重要选择会暂停自动推演',text:'阶段推演会逐年结算，只是减少点击，不会跳过中间年份。遇到重大抉择会暂停，等待你选择。自动速度最多 3×；七日危机需要你为每一天选择应对。'},
    {title:'结算与因果',text:'一世结束后，系统会说明你做过什么、为什么走到结局、哪些人物或势力受到了影响，以及哪些影响可能延续到后世。积分长期累积，可兑换已经实际达到的境界阶段、属性、天赋感悟、物品或技艺。'}
  ];
  function freshState() {
    const attributes = {power:18,stamina:24,luck:15,family:12,aptitude:18,comprehension:20,health:72,reputation:2,mind:22};
    const wallet = Object.fromEntries(DATA.currencies.map(c => [c,0])); wallet['铜币'] = 600;
    return {
      appVersion:'2.2.0', screen:'opening', page:'home', openingIndex:0, openingMode:'first', rebirthIndex:0,
      name:'林砚', familyName:'林家', points:0, runs:0, runsStarted:0,
      meta:{identityDone:false,tutorialIndex:0,tutorialStarted:false,tutorialComplete:false,firstSimFree:true,firstStartReward:false,firstFinishReward:false,firstCarryReward:false,totalTalentRefreshes:0,systemLevel:1,firstBreakthroughReward:false},
      attributes, perks:[], legacySkills:[], inventory:[], inheritedMemories:[], worldHistory:[], history:[],
      claimedQuests:[], claimedAchievements:[], completedQuests:[], completedAchievements:[],
      settings:{speed:1,stepMode:'stage',showDetails:false},
      setup:{options:[],selectedTalentId:null,pathId:'cultivation'},
      world:{age:18,realm:1,level:3,progress:0,lifeExpectancy:100,worldYears:0,regionId:'qingshan',location:'林家旁系小院',wallet,stats:attributes,planId:'natural',completedNodes:[],pendingNode:'opening',crisisDay:0,flags:{},items:[],skills:[],log:[],chronicle:[],npcs:{},deathReason:'',worldEnded:false},
      run:null, pendingRewards:[], pendingSettlement:null, message:'', storageIssue:false, autoArmed:false
    };
  }
  function migrateState(parsed) {
    if(!parsed || !parsed.world) return parsed;
    const oldVersion=String(parsed.appVersion||'');
    const swapRealmIndex=n=>Number(n)===11?12:Number(n)===12?11:Number(n||0);
    const migrateTarget=t=>{
      if(!t||typeof t!=='object')return;
      if(oldVersion==='2.0.0') t.realm=swapRealmIndex(t.realm);
      t.realm=clamp(t.realm,0,DATA.realms.length-1);
      t.level=t.realm===0?0:clamp(t.level||1,1,9);
      t.flags=t.flags||{};t.completedNodes=Array.isArray(t.completedNodes)?t.completedNodes:[];
      t.lifeExpectancy=Math.max(Number(t.lifeExpectancy)||80,currentLifespan(t.realm));
      if(Array.isArray(t.reachedRanks))for(const rank of t.reachedRanks){
        if(oldVersion==='2.0.0')rank.realm=swapRealmIndex(rank.realm);
        rank.ordinal=ordinal(Number(rank.realm)||0,Number(rank.level)||0);
        rank.label=realmName(Number(rank.realm)||0,Number(rank.level)||0);
      }
    };
    migrateTarget(parsed.world);migrateTarget(parsed.run);
    if(oldVersion==='2.0.0'){
      for(const row of (parsed.history||[])){
        if(row && Number.isFinite(Number(row.realmIndex))){
          row.realmIndex=swapRealmIndex(row.realmIndex);
          row.realm=realmName(Number(row.realmIndex)||0,Number(row.level)||0);
        }
      }
      for(const reward of (parsed.pendingRewards||[]))if(reward?.type==='rank'&&reward.rank){
        reward.rank.realm=swapRealmIndex(reward.rank.realm);
        reward.rank.ordinal=ordinal(Number(reward.rank.realm)||0,Number(reward.rank.level)||0);
        reward.rank.label=realmName(Number(reward.rank.realm)||0,Number(reward.rank.level)||0);
        reward.key='rank:'+reward.rank.ordinal;reward.label=`修为传承 · ${reward.rank.label}`;
      }
    }
    parsed.meta=parsed.meta||{};parsed.settings=parsed.settings||{speed:1,stepMode:'stage',showDetails:false};
    parsed.world.stats=parsed.world.stats||parsed.attributes||{};parsed.world.wallet=parsed.world.wallet||{};
    parsed.world.flags=parsed.world.flags||{};parsed.world.completedNodes=Array.isArray(parsed.world.completedNodes)?parsed.world.completedNodes:[];
    if(parsed.run){parsed.run.stats=parsed.run.stats||{};parsed.run.wallet=parsed.run.wallet||{};parsed.run.flags=parsed.run.flags||{};parsed.run.completedNodes=Array.isArray(parsed.run.completedNodes)?parsed.run.completedNodes:[];}
    parsed.appVersion='2.2.0';
    return parsed;
  }
  function tryLoad() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && ['2.0.0','2.1.0','2.2.0'].includes(parsed.appVersion) && parsed.world && Array.isArray(parsed.history)) return migrateState(parsed);
    } catch (_) { /* file:// storage may be disabled; game remains playable in memory */ }
    return null;
  }
  let state = tryLoad() || freshState();
  let autoTimer = null;
  let lastRenderTime = 0;
  function save(silent=true) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); state.storageIssue=false; }
    catch (_) { state.storageIssue=true; }
    if (!silent) state.message = state.storageIssue ? '浏览器未开放本地存储；当前会话仍可游玩，请在设置中导出存档。' : '进度已保存到当前浏览器。';
  }

  function renderLore() {

iv><section class="panel"><div class="panel-kicker">货币兑换</div><h2 class="section-title">相邻货币等级 · 100:1</h2><p class="muted">高阶货币不能直接兑换成更高的任意面额；每次只跨一阶。模拟费用找零时可以自动拆分高阶货币，低阶货币必须手动兑换。</p><div class="exchange-controls"><label>选择货币<select id="exchange-from">${DATA.currencies.map(c=>`<option ${c===(state.world.exchangeFrom||'铜币')?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>兑换数量<input id="exchange-amount" type="number" min="1" value="1"></label><button class="btn" data-action="convert-up">兑换为高一阶</button><button class="btn btn-soft" data-action="convert-down">拆分为低一阶</button></div>${renderCurrency(state.world.wallet)}</section>`;

  function renderImmortalEnding() {
    const w=state.world||{},flags=w.flags||{},chronicle=w.chronicle||[];
    const finalChoice=chronicle.find(x=>x.title==='成仙：万世命途最终目标');

  }
  function renderStoryCampaign() {
    const w=state.world||{};
    const doneIds=new Set(w.completedNodes||[]);
    const realmOrder=Number(w.realm)||0, levelOrder=Number(w.level)||0;
    const pending=w.pendingNode?DATA.storyNodes.find(n=>n.id===w.pendingNode):null;
    const canEnterStarSea=realmOrder>12||(realmOrder===12&&levelOrder>=1)||(w.flags&&w.flags.starSeaUnlocked);
    const completedArcs=DATA.plotArcs.filter(arc=>arc.nodeIds?.length&&arc.nodeIds.every(id=>doneIds.has(id))).length;
    const activePanel=w.flags?.immortalAttained?renderImmortalEnding():(w.crisisDay||pending)?renderHomeStory('reality'):`<section class="panel story-panel"><div class="panel-kicker">主线状态</div><h2>当前没有等待处理的剧情抉择</h2><p class="story-text">完成现实中的下一年推进后，如果境界与前置因果满足条件，下一段主线会自动出现。模拟人生不会替现实直接完成剧情。</p><div class="buttons"><button class="btn" data-action="page" data-page="home">返回主世界，推进现实 →</button></div></section>`;
    const arcCards=DATA.plotArcs.map(arc=>{
      const ids=arc.nodeIds||[];const total=ids.length;const completed=ids.filter(id=>doneIds.has(id)).length;
      const arcNodes=ids.map(id=>DATA.storyNodes.find(n=>n.id===id)).filter(Boolean);
      const minRealm=Number(arc.minRealm??Math.min(...arcNodes.map(n=>Number(n.minRealm)||0),0));
      const minLevel=Number(arc.minLevel??1);
      const gatePassed=realmOrder>minRealm||(realmOrder===minRealm&&levelOrder>=minLevel);
      const isActive=ids.includes(w.pendingNode)||(!gatePassed&&arc.kind==='future-gate'&&((arc.id==='star-sea-arc'&&canEnterStarSea)||(arc.id==='immortal-arc'&&realmOrder>=15)));
      const allDone=total>0&&completed===total;
      const available=gatePassed&&!allDone;
      const status=allDone?'已完成':isActive?'当前剧情':available?'已解锁':'未解锁';
      const statusClass=allDone?'unlocked':isActive?'unlocked':'';
      const pct=total?Math.round(completed/total*100):(gatePassed?100:0);
      const req=arc.minRealm>0?`${DATA.realms[arc.minRealm]||'高阶境界'}${arc.minLevel>1?` ${arc.minLevel}重起`:''}`:'新手开局';
      const source=arc.kind==='novel-continuity'?'小说正文连续性':arc.kind==='future-gate'?'后续篇章入口':arc.kind==='lore-adaptation'?'世界观适配':'游戏前期主线';
      const extra=arc.kind==='future-gate'&&!gatePassed?'达到现实境界后解锁':allDone?'本段已写入现实因果':gatePassed?'前置境界满足；待主线事件推进':'尚未达到前置境界';
      return `<article class="plot-arc-card"><div class="row wrap-row"><span class="chapter">${esc(arc.chapter||'主线')}</span><span class="status-label ${statusClass}">${status}</span></div><div class="panel-kicker">${esc(source)}</div><h3>${esc(arc.title)}</h3><p>${esc(arc.summary)}</p><div class="progress-track"><i style="width:${pct}%"></i></div><div class="row wrap-row"><small class="muted">节点 ${completed}/${total} · 条件：${esc(req)}</small><small class="muted">${esc(extra)}</small></div></article>`;
    }).join('');
    return `<div class="page-heading"><div class="panel-kicker">WANSHI MINGTU · STORY CAMPAIGN</div><h1>万世命途 · 小说主线</h1><p>主线由现实人生推进，关键选择会写入现实因果；模拟可以帮助比较可能性，但模拟进度不会直接跳过现实主线。已知第三百零一至第四百四十章按原有卷名与剧情节点接入；尚未提供正文的星海和仙道后续只保留境界门槛，不虚构成已发生的章节。</p><div class="system-facts"><div><small>当前现实境界</small><b>${esc(realmName(w.realm,w.level))}</b></div><div><small>剧情段落进度</small><b>${completedArcs}/${DATA.plotArcs.length}</b></div><div><small>主线节点</small><b>${doneIds.size}/${DATA.storyNodes.length}</b></div><div><small>星海篇门槛</small><b>${canEnterStarSea?'已满足':'现实圣王境'}</b></div></div></div>${activePanel}<section class="panel"><div class="row wrap-row"><div><div class="panel-kicker">MAIN STORY ROADMAP</div><h2 class="section-title">剧情篇章路线图</h2></div><span class="age-pill">当前：${esc(realmName(w.realm,w.level))}</span></div><div class="plot-arc-grid">${arcCards}</div><div class="hint-strip">世界观固定规则：境界顺序为武圣 → 圣人 → 大圣 → 圣王 → 准帝 → 大帝 → 成仙。圣人高于武圣；大圣仍属于母星篇；只有现实突破圣王后才能正式进入星海篇。</div><div class="buttons"><button class="btn btn-soft" data-action="page" data-page="lore">查看世界志与境界 →</button><button class="btn" data-action="page" data-page="home">返回主世界 →</button></div></section>`;
  }
  function renderMain() {
    let content='';
    if(state.screen==='setup')content=renderSetup();
    else if(state.screen==='simulation')content=renderSim();
    else if(state.screen==='settlement')content=renderSettlement();
    else switch(state.page) {
      case 'home':content=renderHome();break;
      case 'story':content=renderStoryCampaign();break;
      case 'tasks':content=renderTasks();break;
      case 'talents':content=renderTalentAtlas();break;
      case 'archive':content=renderArchive();break;
      case 'lore':content=renderLore();break;
      case 'legacy':content=renderLegacy();break;
      case 'power':content=renderPower();break;
      case 'settings':content=renderSettings();break;
      case 'simulate':content=state.run&&!state.run.finished?renderSim():renderSetup();break;
      default:content=renderHome();
    }
    const active=(state.screen==='setup'||state.screen==='simulation'||state.screen==='settlement')?'simulate':state.page;
    return `<div class="app-shell"><header class="topbar"><div class="brand-mark">命</div><div class="brand-copy"><div class="brand-eyebrow">A LIFE · A THOUSAND FATES</div><div class="brand-name">玄幻人生模拟器 <span>小说主线融合版 2.2.0</span></div></div><div class="topbar-right"><span class="top-status">${state.run&&!state.run.finished?'本世推演中':state.meta.firstSimFree?'首次模拟免费':'现实人生 · '+state.world.age+'岁'}</span><button class="btn btn-soft small-btn" data-action="export-save">导出存档</button></div></header><nav class="nav-bar">${NAV.map(([id,label,ico])=>`<button class="nav-item ${active===id?'active':''}" data-action="page" data-page="${id}"><span>${ico}</span>${label}</button>`).join('')}</nav>${state.message?`<div class="toast-inline" role="status"><span>${esc(state.message)}</span><button data-action="dismiss-message" aria-label="关闭提示">×</button></div>`:''}<div class="app-layout">${(state.screen==='setup'||state.screen==='simulation'||state.screen==='settlement'||state.page==='home'||state.page==='power')?renderLeftCard():''}<main class="content-area">${content}</main></div><footer class="footer"><span>独立 HTML · 本地运行 · 无外部运行时依赖</span><span>${state.storageIssue?'自动保存不可用 · 可导出存档':'自动保存：尽力启用'} · ${state.runs}世已结算</span></footer></div>`;
  }
  function renderIntro() {
    const page=DATA.openingPages[Math.max(0,Math.min(DATA.openingPages.length-1,state.openingIndex))];
    if(!page)return renderIdentity();
    return `<div class="intro-shell"><div class="intro-top"><div class="brand-mark">命</div><span class="top-status">序章 · ${state.openingIndex+1}/${DATA.openingPages.length}</span></div><div class="intro-body"><div class="intro-kicker">${esc(page.chapter||'序章')}</div><div class="intro-progress"><i style="width:${(state.openingIndex+1)/DATA.openingPages.length*100}%"></i></div><h1>${esc(page.title)}</h1><p class="intro-text">${esc(page.text)}</p><div class="intro-controls"><button class="btn btn-soft" data-action="intro-prev" ${state.openingIndex===0?'disabled':''}>← 上一页</button><button class="btn" data-action="intro-next">${state.openingIndex===DATA.openingPages.length-1?'继续 · 为这一世命名':'继续 →'}</button></div></div><div class="intro-bottom"><span>玄幻世界 · 武道与因果</span><span>所有选择只推进属于你的故事</span></div></div>`;
  }
  function renderIdentity() {
    return `<div class="intro-shell identity-shell"><div class="intro-top"><div class="brand-mark">命</div><span class="top-status">身份录入 · 100%</span></div><section class="identity-card"><div class="intro-kicker">IDENTITY INITIALIZATION</div><h1>为这一世命名</h1><p>名字的姓氏将影响大炎王朝中的家族称谓。主角设定仍是林家旁支、练体三重、六百文铜钱；可以自行改名，但你的选择会被保存在本地档案。</p><label class="field-label" for="identity-name">主角姓名（建议 2—12 个汉字或字母数字）</label><input id="identity-name" maxlength="12" value="${esc(state.name||'林砚')}" placeholder="林砚"><div class="identity-preview"><div class="portrait large">林</div><div><b id="identity-preview-name">${esc(state.name||'林砚')}</b><small id="identity-preview-family">林家 · 旁系子弟</small><small>现实身份：练体三重 · 600文铜钱</small></div></div><div class="buttons"><button class="btn" data-action="confirm-identity">确认身份，连接系统 →</button></div></section><div class="intro-bottom"><span>身份只保存于此设备的本地存档</span><span>可在设置中导出备份</span></div></div>`;
  }
  function renderRebirth() {
    const page=DATA.rebirthPages[Math.max(0,Math.min(DATA.rebirthPages.length-1,state.rebirthIndex||0))];
    if(!page){endRealityLife();return '';}
    return `<div class="intro-shell rebirth-shell"><div class="intro-top"><div class="brand-mark">轮</div><span class="top-status">轮回 · ${state.rebirthIndex+1}/${DATA.rebirthPages.length}</span></div><div class="intro-body"><div class="intro-kicker">${esc(page.chapter||'轮回')}</div><div class="intro-progress"><i style="width:${(state.rebirthIndex+1)/DATA.rebirthPages.length*100}%"></i></div><h1>${esc(page.title)}</h1><p class="intro-text">${esc(page.text)}</p><div class="intro-controls"><button class="btn" data-action="rebirth-next">${state.rebirthIndex===DATA.rebirthPages.length-1?'重新踏入这一世 →':'继续轮回 →'}</button></div></div><div class="intro-bottom"><span>积分、永久传承和往世记录会保留</span><span>现实年龄、境界与钱财按轮回规则重新开始</span></div></div>`;
  }
  function renderTutorial() {
    const page=tutorialPages[Math.max(0,Math.min(tutorialPages.length-1,state.meta.tutorialIndex||0))];
    return `<div class="tutorial-shell"><div class="system-dialog"><div class="system-icon">⌘</div><div class="intro-kicker">SYSTEM CONNECTION · 初次连接</div><div class="tutorial-count">教学对话 ${number(state.meta.tutorialIndex)+1} / ${tutorialPages.length}</div><h1>${esc(page.title)}</h1><p>${esc(page.text)}</p><div class="system-note">${number(state.meta.tutorialIndex)===2?'提醒：天赋品级不是无条件通关保证。':number(state.meta.tutorialIndex)===3?'重大抉择的成功率只表示当前行动，不等于整条剧情结局已保证。':'这是不可跳过的首世教学。只有完成第一世并同步实际收获后，教学状态才会结束。'}</div><div class="buttons"><button class="btn" data-action="tutorial-next">${number(state.meta.tutorialIndex)>=tutorialPages.length-1?'完成系统对话，进入主世界 →':'继续对话 →'}</button></div></div></div>`;
  }
  function render() {
    try {
      if(state.screen==='opening')app.innerHTML=renderIntro();
      else if(state.screen==='identity')app.innerHTML=renderIdentity();
      else if(state.screen==='tutorial')app.innerHTML=renderTutorial();
      else if(state.screen==='death')app.innerHTML=renderDeath();
      else if(state.screen==='rebirth')app.innerHTML=renderRebirth();
      else app.innerHTML=renderMain();
      save(true);
    } catch (err) {
      app.innerHTML=`<div class="fatal"><b>页面渲染出现错误</b><p>${esc(err?.message||String(err))}</p><button class="btn btn-soft" data-action="back-home">返回安全页面</button><button class="btn" data-action="export-save">导出存档</button></div>`;
    }
  }
  function onClick(event) {
    const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;
    const a=btn.dataset.action, id=btn.dataset.id, page=btn.dataset.page, mode=btn.dataset.mode||'simulation';
    if(a==='intro-next'){if(state.openingIndex<DATA.openingPages.length-1)state.openingIndex++;else state.screen='identity';save();render();}
    else if(a==='intro-prev'){state.openingIndex=Math.max(0,state.openingIndex-1);render();}
    else if(a==='confirm-identity'){
      const name=$('identity-name')?.value?.trim()||'林砚';state.name=name.slice(0,12);const surname=(name.match(/^[\u4e00-\u9fa5]{1,2}/)||['林'])[0];state.familyName=surname+'家';state.world.location=state.familyName+'旁系小院';state.meta.identityDone=true;state.meta.tutorialStarted=true;state.meta.tutorialIndex=0;state.screen='tutorial';appendLog(state.world,'你在青山县林家旁支的生活已满一年，万界人生模拟系统绑定成功。','系统降临');save();render();}
    else if(a==='tutorial-next'){if(state.meta.tutorialIndex<tutorialPages.length-1)state.meta.tutorialIndex++;else{state.screen='main';state.page='home';state.meta.tutorialStarted=true;}save();render();}
    else if(a==='page')setPage(page);
    else if(a==='start-setup')startSetup();
    else if(a==='pick-talent'){state.setup.selectedTalentId=id;save();render();}
    else if(a==='pick-path'){state.setup.pathId=id;save();render();}
    else if(a==='refresh-talents'){if((state.world.wallet['铜币']||0)<25){setMessage('天赋重掷需要25铜币。');render();return;}addMoney(state.world,-25,'铜币');state.meta.totalTalentRefreshes++;drawTalents();setMessage('已重掷三张天赋候选；旧候选不再参与本次选择。');tryClaimAchievements();save();render();}
    else if(a==='start-run')startRun();
    else if(a==='back-home')goHome();
    else if(a==='world-plan'){state.world.planId=id;setMessage('下一年度计划已设为：'+(DATA.worldPlans.find(p=>p.id===id)?.name||id));save();render();}
    else if(a==='advance-reality')advanceRealityYear();
    else if(a==='node-choice')resolveNode(mode,btn.dataset.node,id);
    else if(a==='daily')handleDailyAction(mode,id);
    else if(a==='scenario-choice')resolveScenario(mode,Number(btn.dataset.index));
    else if(a==='advance-sim')advanceOneStep('simulation');
    else if(a==='toggle-auto')toggleAuto();
    else if(a==='speed'){state.settings.speed=Number(btn.dataset.value)||1;save();render();if(state.autoArmed)scheduleAuto();}
    else if(a==='step-mode'){state.settings.stepMode=btn.dataset.value==='year'?'year':'stage';save();render();}
    else if(a==='finish-run'){if(state.run&&!state.run.finished){state.run.deathReason='你主动选择结束本世推演。人生在此封存；结局不等于死亡，也不会抹去此前的经历。';finishRun();}}
    else if(a==='death-continue'){if(state.deathMode==='reality'){state.screen='rebirth';state.rebirthIndex=0;save();render();}else{state.deathMode='simulation';finishRun();}}
    else if(a==='rebirth-next'){if(number(state.rebirthIndex)<DATA.rebirthPages.length-1){state.rebirthIndex++;save();render();}else endRealityLife();}
    else if(a==='sync-settlement')syncSettlement();
    else if(a==='buy-reward'){
      const r=state.run;if(!r)return;const key=btn.dataset.key;let item=null;
      for(const rank of (r.reachedRanks||[]))if('rank:'+rank.ordinal===key)item={type:'rank',key,label:`修为传承 · ${rank.label}`,rank};
      if(r.talent&&'talent:'+r.talent.id===key)item={type:'talent',key,label:`天赋感悟 · ${r.talent.name}`,talent:r.talent};
      for(const s of r.skills||[])if('skill:'+s===key)item={type:'skill',key,label:s,value:s};
      for(const s of r.items||[])if('item:'+s===key)item={type:'item',key,label:s,value:s};
      if(item)buyReward(item);
    }
    else if(a==='buy-attribute')buyReward({type:'attribute',key:'attribute:'+btn.dataset.stat+':3:'+state.run.id,label:`${STAT_LABEL[btn.dataset.stat]||btn.dataset.stat} +3`,stat:btn.dataset.stat,amount:3});
    else if(a==='upgrade-system')buySystemUpgrade();
    else if(a==='claim-quest')claimQuest(id);
    else if(a==='export-save')exportSave();
    else if(a==='convert-up'||a==='convert-down'){const sel=$('exchange-from');const amount=$('exchange-amount')?.value||1;state.world.exchangeFrom=sel?.value||'铜币';convertCurrency(a==='convert-up'?'up':'down',amount);}
    else if(a==='reset-game'){if(confirm('确定从零开始？当前重制版存档会被清空；建议先导出备份。'))resetGame();}
    else if(a==='talent-filter'){talentFilter=btn.dataset.value;talentPage=1;render();}
    else if(a==='talent-page'){talentPage=Math.max(1,Number(btn.dataset.value)||1);render();}
    else if(a==='dismiss-message'){state.message='';render();}
  }
  app.addEventListener('click',onClick);
  app.addEventListener('change',event=>{
    if(event.target.id==='talent-search'){talentQuery=event.target.value||'';talentPage=1;render();}
    if(event.target.id==='talent-quality'){talentQuality=event.target.value;talentPage=1;render();}
    if(event.target.id==='exchange-from'){state.world.exchangeFrom=event.target.value;save();}
    if(event.target.id==='import-file')importSaveFile(event.target.files?.[0]);
  });
  app.addEventListener('input',event=>{
    if(event.target.id==='identity-name'){
      const name=event.target.value||'林砚';const surname=(name.match(/^[\u4e00-\u9fa5]{1,2}/)||['林'])[0];const preview=$('identity-preview-name');const family=$('identity-preview-family');if(preview)preview.textContent=name;if(family)family.textContent=surname+'家 · 旁系子弟';
    }
  });
  // If the user reloads in an active state, restore a coherent route without rerunning startup hooks.
  if(state.screen==='tutorial'&&!state.meta.identityDone)state.screen='identity';
  if(state.screen==='simulation'&&(!state.run||state.run.finished))state.screen='main';
  if(state.screen==='setup'&&!state.setup.options?.length)drawTalents();
  if(state.screen==='opening'&&state.meta.identityDone)state.screen='main';
  if(state.world&&!state.world.stats)state.world.stats=state.attributes;
  if(state.world&&state.world.pendingNode==null&&!state.world.crisisDay) {const n=nextEligibleNode('reality');if(n)state.world.pendingNode=n;}
  if(state.run&&state.run.pendingNode==null&&!state.run.crisisDay&&!state.run.finished&&!state.run.pendingScenario){const n=nextEligibleNode('simulation');if(n)state.run.pendingNode=n;}
  render();
  // Public tiny API for QA smoke tests; the game itself needs no parent frame or platform integration.
  window.LifeSimFresh = {version:'2.2.0',dataCounts:{talents:DATA.talents.length,nodes:DATA.storyNodes.length,realms:DATA.realms.length},getState:()=>JSON.parse(JSON.stringify(state))};
})();

</script>
</body>
</html>
